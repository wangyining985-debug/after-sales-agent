[project]
name = "mini-after-sales-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.11,<3",
  "langgraph>=0.6,<2",
  "mcp>=2.0,<3",
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
  "pydantic-settings>=2.10,<3",
  "langgraph-checkpoint-postgres>=3.0,<4",
  "psycopg[binary,pool]>=3.2,<4",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "httpx>=0.28,<1",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
